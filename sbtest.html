<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>t</title>
<style>body{margin:0;padding:12px;font:400 15px monospace;background:#2f7ff0;color:#fff}#info{background:#000;color:#0f0;padding:8px;white-space:pre-wrap}
#a{background:Canvas;color:CanvasText}#b{background:light-dark(#ffffff,#000000)}#c{color-scheme:light dark;background:Canvas}</style></head><body>
<div id="info">...</div><div id="a">a</div><div id="b">b</div><div id="c">c</div><iframe id="f" style="width:10px;height:10px;border:0"></iframe>
<canvas id="cv" width="4" height="4"></canvas>
<script>
var out=[];function m(q){return matchMedia(q).matches}
out.push(navigator.userAgent);
out.push('dark='+m('(prefers-color-scheme: dark)')+' light='+m('(prefers-color-scheme: light)'));
['a','b','c'].forEach(function(i){out.push(i+' bg='+getComputedStyle(document.getElementById(i)).backgroundColor+' fg='+getComputedStyle(document.getElementById(i)).color)});
try{var w=document.getElementById('f').contentWindow;out.push('iframe dark='+w.matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){out.push('iframe err')}
var cx=document.getElementById('cv').getContext('2d');cx.fillStyle='#ffffff';cx.fillRect(0,0,4,4);var d=cx.getImageData(1,1,1,1).data;out.push('canvas='+[d[0],d[1],d[2]]);
out.push('darkreader-ish html attrs='+[].map.call(document.documentElement.attributes,function(a){return a.name}).join(','));
out.push('style sheets='+document.styleSheets.length+' head children='+document.head.children.length);
setTimeout(function(){out.push('later sheets='+document.styleSheets.length+' attrs='+[].map.call(document.documentElement.attributes,function(a){return a.name+'='+a.value}).join(','));document.getElementById('info').textContent=out.join('\n')},1500);
document.getElementById('info').textContent=out.join('\n');
</script></body></html>
